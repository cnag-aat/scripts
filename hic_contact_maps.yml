# Conda environment for hic_contact_maps.sbatch / plot_hic_maps.py
#
#   conda env create -f hic_contact_maps.yml        # creates env "hic_contact_maps"
#   conda activate hic_contact_maps
#
# On Apple Silicon, bioconda lacks native builds for some of these; use
#   CONDA_SUBDIR=osx-64 conda env create -f hic_contact_maps.yml
name: hic_contact_maps
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10,<3.13
  # mapping
  - chromap >=0.2.6
  - samtools >=1.17          # faidx -> chromsizes
  - htslib >=1.17            # bgzip
  - pigz
  # cooler / mcool
  - cooler >=0.9.3
  - cooltools >=0.6          # not required by the pipeline; handy for downstream analysis
  # pretext
  - pretextmap >=0.1.9
  - pretextsnapshot >=0.0.4
  # plotting
  - numpy
  - scipy
  - matplotlib-base >=3.7
